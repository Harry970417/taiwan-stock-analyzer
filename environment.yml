name: taiwan-stock-analyzer
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
    # --- Phase 1 mainline: aligned with requirements.txt and pyproject.toml ---
    - streamlit==1.58.0
    - pandas>=2.0.0,<3.0
    - numpy>=1.24.0,<2.0
    - yfinance==1.4.1
    - plotly==6.8.0
    - matplotlib==3.10.9
    - scikit-learn>=1.3.0
    - scipy==1.17.1
    - ta==0.11.0
    - sqlalchemy==2.0.50
    - openpyxl>=3.1.0
    - requests==2.34.2
    - pytz==2026.2

# --- 重現指令 ---
# conda env create -f environment.yml
# conda activate taiwan-stock-analyzer
# streamlit run app.py
#
# This environment is intentionally range-based for the Python 3.11 mainline.
# Use snapshot metadata for exact data provenance in research runs.
