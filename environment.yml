name: taiwan-stock-analyzer
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - pandas>=2.0.0,<3.0
      - numpy>=1.24.0,<2.0
      - scipy==1.17.1
      - yfinance==1.4.1
      - requests==2.34.2
      - plotly==6.8.0
      - python-dateutil==2.9.0.post0
      - pytz==2026.2
      - streamlit==1.58.0
      - matplotlib==3.10.9
      - sqlalchemy==2.0.50
      - ta==0.11.0
      - scikit-learn>=1.3.0
      - openpyxl>=3.1.0

# Main application environment:
#   conda env create -f environment.yml
#
# Remediation replay, if needed:
#   python -m pip install -r requirements.lock.txt
#   python scripts/run_critical_remediation.py
